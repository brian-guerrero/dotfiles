# Provisioning input for run_onchange_before_windows-scoop-packages.ps1.tmpl.
# Not a dotfile — chezmoi loads this as template data and never deploys it.
# Edit the list, then `chezmoi apply` reinstalls the delta.
scoop:
  # 'main' is built in; only extra buckets need listing.
  buckets:
    - name: extras
      source: https://github.com/ScoopInstaller/Extras
    - name: nerd-fonts
      source: https://github.com/matthewjberger/scoop-nerd-fonts
  # Bucket-qualified names pin where each app resolves from.
  apps:
    - 7zip
    - fzf
    - lua-language-server
    - oh-my-posh          # main bucket; the PowerShell profile calls it unconditionally
    - pwsh
    - ripgrep
    - extras/lazygit
    - extras/obs-studio
    - extras/winscp
    - nerd-fonts/JetBrains-Mono
    - nerd-fonts/JetBrainsMono-NF
    - make
